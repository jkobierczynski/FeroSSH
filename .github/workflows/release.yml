name: Release

# Pushing a version tag such as v0.1.0 runs every CI check, builds the
# release exes, signs them when a certificate is configured, and publishes a
# GitHub Release with the exes, their SHA-256 sums, a release manifest
# (BUILD-MANIFEST.json) and the notes from docs/releases/<tag>.md. The exes,
# sums and manifest get signed build provenance attestations. A tag with a
# hyphen (v0.2.0-rc1) makes a pre-release.

on:
  push:
    tags: ["v*.*.*"]
  # A dry run from the Actions tab: every step except the attestation and
  # the GitHub Release, whose files are uploaded as a workflow artifact
  # instead.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with the workspace version and look for notes
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "${tag%%-*}" ]; then
            echo "::error::Tag $tag does not match the workspace version $version in Cargo.toml"
            exit 1
          fi
          if [ ! -f "docs/releases/$tag.md" ]; then
            echo "::error::docs/releases/$tag.md is missing; the release notes come from there"
            exit 1
          fi

  # The same jobs as on a pull request: Windows build and tests, the Linux
  # SSH, tmux, desktop viewer and interop tests, cargo deny, cargo audit and
  # the fuzz smoke runs. Its Windows job uploads the release exes.
  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
      # Build provenance attestations, signed through GitHub's Sigstore
      # instance with this workflow's identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ferossh-exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ferossh-desktop-viewer-exe
          path: dist

      # Taken before signing: these are the hashes a rebuild with
      # scripts/build-release.ps1 reproduces (CI's reproducible build job
      # has already checked that it does).
      - name: Unsigned SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii "$env:RUNNER_TEMP\unsigned.txt"

      # Signing hook. It runs only when the WINDOWS_SIGNING_CERT secret is
      # set (a base64 .pfx with its password in
      # WINDOWS_SIGNING_CERT_PASSWORD); until then the exes go out unsigned.
      # For Azure Trusted Signing, replace this step with
      # azure/trusted-signing-action.
      - name: Sign the exes
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT) {
            "No signing certificate configured: the exes are not signed." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:CERT_PASSWORD dist\ferossh.exe dist\ferossh-desktop.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa dist\ferossh.exe dist\ferossh-desktop.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfx -Force
          }

      # The sums are taken after signing, so they match what is downloaded.
      - name: SHA-256 sums
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem *.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Pop-Location

      # BUILD-MANIFEST.json says what was built from what: the tag, commit,
      # toolchain and, per exe, its size, its SHA-256 as downloaded and its
      # SHA-256 before signing. The attestation below signs it.
      - name: Release manifest
        shell: pwsh
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dry-run' }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $unsigned = @{}
          foreach ($line in Get-Content "$env:RUNNER_TEMP\unsigned.txt") {
            $hash, $name = $line -split "  ", 2
            $unsigned[$name] = $hash
          }
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches[0].Groups[1].Value
          $files = Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            [ordered]@{
              name            = $_.Name
              size            = $_.Length
              sha256          = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              sha256_unsigned = $unsigned[$_.Name]
              authenticode    = "$($sig.Status)"
            }
          }
          [ordered]@{
            schema     = 1
            name       = "FeroSSH"
            version    = $env:TAG.TrimStart("v")
            tag        = $env:TAG
            repository = "https://github.com/$env:REPO"
            commit     = $env:COMMIT
            toolchain  = $toolchain
            build      = "pwsh scripts/build-release.ps1"
            workflow   = $env:RUN_URL
            files      = @($files)
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM dist\BUILD-MANIFEST.json
          Get-Content dist\BUILD-MANIFEST.json

      # Verify with: gh attestation verify ferossh.exe -R jkobierczynski/FeroSSH
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-path: |
            dist/ferossh.exe
            dist/ferossh-desktop.exe
            dist/SHA256SUMS.txt
            dist/BUILD-MANIFEST.json

      # winget manifests for ferossh.exe, to submit to microsoft/winget-pkgs
      # by hand (see scripts/winget-manifest.ps1). Not part of the release.
      - name: winget manifests
        shell: pwsh
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dry-run' }}
        run: pwsh scripts/winget-manifest.ps1 -Version $env:TAG.TrimStart("v") -Sums dist/SHA256SUMS.txt -OutDir winget
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: release-dry-run
          path: dist

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $pre = if ($env:TAG.Contains("-")) { @("--prerelease") } else { @() }
          gh release create $env:TAG --verify-tag --title "FeroSSH $env:TAG" `
            --notes-file "docs/releases/$env:TAG.md" @pre `
            dist/ferossh.exe dist/ferossh-desktop.exe dist/SHA256SUMS.txt dist/BUILD-MANIFEST.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
