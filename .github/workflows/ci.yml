name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p ferossh
      - name: Report exe size
        shell: pwsh
        run: |
          $exe = Get-Item target/release/ferossh.exe
          $kb = [math]::Round($exe.Length / 1KB)
          "ferossh.exe: $kb KB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ferossh-exe
          path: target/release/ferossh.exe

  sshd:
    name: SSH tests against OpenSSH (Linux)
    runs-on: ubuntu-latest
    env:
      FEROSSH_REQUIRE_SSHD: 1
      FEROSSH_REQUIRE_PUTTYGEN: 1
      FEROSSH_REQUIRE_TMUX: 1
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # The worker and the window's SSH path log in to a throwaway sshd on
      # 127.0.0.1, and the .ppk tests make keys with puttygen; without them
      # these tests skip, so install both. sshd needs xauth for X11
      # forwarding, and the tmux test drives a real tmux.
      - run: sudo apt-get update && sudo apt-get install -y openssh-server putty-tools xauth tmux
      - run: sudo mkdir -p /run/sshd
      - run: cargo test --locked -p ferossh-worker --test sshd
      - run: cargo test --locked -p ferossh-worker --test agent
      - run: cargo test --locked -p ferossh-sftp --test queue
      - run: cargo test --locked -p ferossh ssh_e2e
      - run: cargo test --locked -p ferossh forwards_e2e
      - run: tmux -V
      - run: cargo test --locked -p ferossh tmux_e2e
      - run: cargo test --locked -p ferossh-auth keyfile

  interop:
    name: Interop against older and newer servers (Linux)
    runs-on: ubuntu-latest
    env:
      FEROSSH_REQUIRE_INTEROP: 1
      FEROSSH_REQUIRE_TMUX: 1
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # One image per Ubuntu release: OpenSSH 7.6 to 10.x, Dropbear 2017 to
      # 2025, tmux 2.6 to 3.6. See interop/Dockerfile.
      - run: interop/build.sh
      - run: cargo test --locked -p ferossh-worker --test interop -- --nocapture
      # tmux 2.6 (refused), 3.0a and 3.2a (tmux layout only), 3.4, 3.6.
      - name: tmux control mode against tmux 2.6 to 3.6
        run: |
          for r in 18.04 20.04 22.04 24.04 26.04; do
            id=$(docker run -d --entrypoint sleep ferossh-interop:$r infinity)
            echo "::group::$(docker exec "$id" tmux -V)"
            FEROSSH_TMUX_CONTAINER=$id cargo test --locked -p ferossh tmux_e2e
            docker rm -f "$id" >/dev/null
            echo "::endgroup::"
          done

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Same exception as deny.toml; see the reason there.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which AddressSanitizer does not support.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ipc_decode -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu term_feed -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu sftp_decode -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu forward_parse -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu tmux_feed -- -max_total_time=60
