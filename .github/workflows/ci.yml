name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs every check here before it publishes a release.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The optional built-in desktop viewer (Cargo features, off by
      # default): VNC only, RDP only, and both.
      - run: cargo clippy -p ferossh --all-targets --features vnc-viewer --locked -- -D warnings
      - run: cargo clippy -p ferossh --all-targets --features rdp-viewer --locked -- -D warnings
      - run: cargo clippy -p ferossh --all-targets --features desktop-viewer --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p ferossh --features desktop-viewer --locked
      # Three exes: the standard one, with none of the viewer's code;
      # ferossh-vnc.exe with the VNC viewer; ferossh-desktop.exe with the
      # VNC and RDP viewers. The script is the reproducible release build.
      - run: pwsh scripts/build-release.ps1
      - name: Report exe sizes
        shell: pwsh
        run: |
          $std = (Get-Item dist/ferossh.exe).Length
          $vnc = (Get-Item dist/ferossh-vnc.exe).Length
          $desk = (Get-Item dist/ferossh-desktop.exe).Length
          "ferossh.exe: $([math]::Round($std / 1KB)) KB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "ferossh-vnc.exe (VNC viewer): $([math]::Round($vnc / 1KB)) KB, +$([math]::Round(($vnc - $std) / 1KB)) KB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "ferossh-desktop.exe (VNC and RDP viewers): $([math]::Round($desk / 1KB)) KB, +$([math]::Round(($desk - $std) / 1KB)) KB (RDP: +$([math]::Round(($desk - $vnc) / 1KB)) KB)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ferossh-exe
          path: dist/ferossh.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ferossh-vnc-viewer-exe
          path: dist/ferossh-vnc.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ferossh-desktop-viewer-exe
          path: dist/ferossh-desktop.exe

  # Rebuilds the exes on a fresh runner, in another folder and with another
  # CARGO_HOME, and fails unless the bytes match the Windows job's exes.
  reproducible:
    name: Reproducible build (Windows)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: elsewhere/ferossh
      - uses: actions/download-artifact@v4
        with:
          pattern: ferossh-*exe
          path: first
          merge-multiple: true
      - name: Rebuild
        shell: pwsh
        env:
          CARGO_HOME: ${{ runner.temp }}\cargo-home
        working-directory: elsewhere/ferossh
        run: |
          rustup show active-toolchain
          pwsh scripts/build-release.ps1
      - name: Compare with the Windows job's exes
        shell: pwsh
        run: |
          $failed = $false
          foreach ($exe in Get-ChildItem first\*.exe | Sort-Object Name) {
            $a = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            $b = (Get-FileHash "elsewhere\ferossh\dist\$($exe.Name)" -Algorithm SHA256).Hash.ToLower()
            $line = if ($a -eq $b) { "same    $a  $($exe.Name)" } else { $failed = $true; "DIFFERS $a / $b  $($exe.Name)" }
            $line | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          if ($failed) {
            "::error::The rebuilt exes differ from the Windows job's exes"
            exit 1
          }

  sshd:
    name: SSH tests against OpenSSH (Linux)
    runs-on: ubuntu-latest
    env:
      FEROSSH_REQUIRE_SSHD: 1
      FEROSSH_REQUIRE_PUTTYGEN: 1
      FEROSSH_REQUIRE_TMUX: 1
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # The worker and the window's SSH path log in to a throwaway sshd on
      # 127.0.0.1, and the .ppk tests make keys with puttygen; without them
      # these tests skip, so install both. sshd needs xauth for X11
      # forwarding, and the tmux test drives a real tmux. The security key
      # test builds OpenSSH's software security key from the installed
      # OpenSSH's source (interop/sk-dummy.sh), so it needs deb-src.
      - run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y openssh-server putty-tools xauth tmux dpkg-dev autoconf libssl-dev zlib1g-dev
      - run: sudo mkdir -p /run/sshd
      - run: cargo test --locked -p ferossh-worker --test sshd
      - run: cargo test --locked -p ferossh-worker --test agent
      - run: interop/sk-dummy.sh "$RUNNER_TEMP/sk-dummy.so"
      - run: cargo test --locked -p ferossh-worker --test security_keys
        env:
          FEROSSH_SK_DUMMY: ${{ runner.temp }}/sk-dummy.so
          FEROSSH_REQUIRE_SK_DUMMY: 1
      - run: cargo test --locked -p ferossh-sftp --test queue
      - run: cargo test --locked -p ferossh ssh_e2e
      - run: cargo test --locked -p ferossh forwards_e2e
      - run: tmux -V
      - run: cargo test --locked -p ferossh tmux_e2e
      - run: cargo test --locked -p ferossh-auth keyfile

  rdp:
    name: Desktop viewers against xrdp and Xvnc (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # A throwaway xrdp with an Xorg session running one xterm, whose
      # background colour the test waits for; then it types a command.
      - run: sudo apt-get update && sudo apt-get install -y xrdp xorgxrdp xterm
      - run: |
          sudo useradd -m -s /bin/bash rdptest
          echo 'rdptest:Secret-pw1' | sudo chpasswd
          printf '#!/bin/sh\nexec xterm -geometry 80x24+10+10 -bg "#336699"\n' | sudo tee /home/rdptest/.xsession
          sudo chmod +x /home/rdptest/.xsession
          sudo chown rdptest /home/rdptest/.xsession
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/' /etc/X11/Xwrapper.config
          # xrdp falls back to old RDP security without TLS when it cannot
          # read its key, which the viewer refuses.
          sudo adduser xrdp ssl-cert
          sudo systemctl restart xrdp-sesman xrdp
      - run: "cargo test --locked -p ferossh-viewer --features rdp rdp::"
        env:
          FEROSSH_TEST_RDP: "127.0.0.1:3389 rdptest Secret-pw1"
      # A throwaway TigerVNC Xvnc, which takes SetDesktopSize, for the VNC
      # viewer's resize.
      - run: |
          sudo apt-get install -y tigervnc-standalone-server
          Xvnc :5 -SecurityTypes None -geometry 800x600 -rfbport 5905 -localhost yes &
          sleep 2
      - run: "cargo test --locked -p ferossh-viewer --features vnc resizes_a_real_server"
        env:
          FEROSSH_TEST_VNC: "127.0.0.1:5905"

  interop:
    name: Interop against older and newer servers (Linux)
    runs-on: ubuntu-latest
    env:
      FEROSSH_REQUIRE_INTEROP: 1
      FEROSSH_REQUIRE_TMUX: 1
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # One image per Ubuntu release: OpenSSH 7.6 to 10.x, Dropbear 2017 to
      # 2025, tmux 2.6 to 3.6. See interop/Dockerfile.
      - run: interop/build.sh
      - run: cargo test --locked -p ferossh-worker --test interop -- --nocapture
      # tmux 2.6 (refused), 3.0a and 3.2a (tmux layout only), 3.4, 3.6.
      - name: tmux control mode against tmux 2.6 to 3.6
        run: |
          for r in 18.04 20.04 22.04 24.04 26.04; do
            id=$(docker run -d --entrypoint sleep ferossh-interop:$r infinity)
            echo "::group::$(docker exec "$id" tmux -V)"
            FEROSSH_TMUX_CONTAINER=$id cargo test --locked -p ferossh tmux_e2e
            docker rm -f "$id" >/dev/null
            echo "::endgroup::"
          done

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Same exception as deny.toml; see the reason there.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which AddressSanitizer does not support.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ipc_decode -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu term_feed -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu sftp_decode -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu forward_parse -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu tmux_feed -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu vnc_decode -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu rdp_decode -- -max_total_time=60
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu import_parse -- -max_total_time=60
