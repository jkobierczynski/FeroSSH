[package]
name = "ferossh-vnc"
description = "FeroSSH: VNC (RFB) client for the optional built-in desktop viewer, and the viewer process's pipe protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# VNC password authentication is DES, as RFC 6143 fixes it.
des = "0.9"
# ZRLE rectangles are zlib streams.
miniz_oxide = "0.8"
zeroize = "1.9"

[lints]
workspace = true
