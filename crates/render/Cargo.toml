[package]
name = "ferossh-render"
description = "FeroSSH: DirectWrite/Direct2D glyph atlas and grid drawing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Draws pictures (the built-in desktop viewer's remote screen) in panes.
images = []

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
] }
# The `implement` macro (the text source DirectWrite's script analysis
# reads) and `Vector2` (glyph run origins) name these crates; both are
# already in the build through `windows`.
windows-core = "0.62"
windows-numerics = "0.3"

[lints]
workspace = true
