[package]
name = "ferossh-worker"
description = "FeroSSH: Sandboxed SSH worker: russh sessions, channels, forwards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferossh-forward.workspace = true
ferossh-ipc.workspace = true
getrandom = "0.4"
ferossh-render.workspace = true
ferossh-sftp.workspace = true
ferossh-term.workspace = true
russh.workspace = true
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros"] }


[dev-dependencies]
ferossh-auth = { workspace = true, features = ["soft-authenticator"] }
ferossh-render.workspace = true
ferossh-sftp.workspace = true
ferossh-term.workspace = true
tokio = { version = "1.54", features = ["rt", "macros", "time"] }

[lints]
workspace = true
