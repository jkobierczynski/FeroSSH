[package]
name = "ferossh-worker"
description = "FeroSSH: Sandboxed SSH worker: russh sessions, channels, forwards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Already linked through ferossh-update.
base64ct = { version = "1.8", features = ["alloc"] }
ferossh-forward.workspace = true
ferossh-ipc.workspace = true
ferossh-mosh.workspace = true
getrandom = "0.4"
ferossh-render.workspace = true
ferossh-sftp.workspace = true
ferossh-term.workspace = true
ferossh-zmodem.workspace = true
russh.workspace = true
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
zeroize = "1.9"


[dev-dependencies]
ferossh-auth = { workspace = true, features = ["soft-authenticator", "mit-gssapi"] }
ferossh-render.workspace = true
ferossh-sftp.workspace = true
ferossh-term.workspace = true
tokio = { version = "1.54", features = ["rt", "macros", "time"] }

[lints]
workspace = true
