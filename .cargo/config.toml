# Statically link the C runtime so the exe needs no VC++ redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
# /Brepro: no timestamps in the exe, so the same source gives the same bytes
# (see scripts/build-release.ps1).
# Control Flow Guard: indirect calls may only reach real function starts
# (the sandboxed processes also enforce it, see crates/app/src/sandbox.rs).
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/Brepro",
    # No "Rich" header: it lists the build number of link.exe and of every
    # MSVC tool that made the C runtime's objects, so a servicing update of
    # the same MSVC toolset (14.44.35229 -> 14.44.35230) changed the exe's
    # bytes without changing any code in it.
    "-C", "link-arg=/emittoolversioninfo:no",
    "-C", "control-flow-guard",
]
