[package]
name = "ferossh-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferossh-ipc = { path = "../crates/ipc" }
ferossh-render = { path = "../crates/render" }
ferossh-sftp = { path = "../crates/sftp" }
ferossh-term = { path = "../crates/term" }

# Kept out of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "ipc_decode"
path = "fuzz_targets/ipc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "term_feed"
path = "fuzz_targets/term_feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sftp_decode"
path = "fuzz_targets/sftp_decode.rs"
test = false
doc = false
bench = false
