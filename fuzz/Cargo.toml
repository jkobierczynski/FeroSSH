[package]
name = "ferossh-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferossh-auth = { path = "../crates/auth" }
ferossh-config = { path = "../crates/config" }
ferossh-forward = { path = "../crates/forward" }
ferossh-ipc = { path = "../crates/ipc" }
ferossh-render = { path = "../crates/render" }
ferossh-sftp = { path = "../crates/sftp" }
ferossh-term = { path = "../crates/term" }
ferossh-tmuxcc = { path = "../crates/tmuxcc" }
ferossh-viewer = { path = "../crates/viewer", features = ["vnc", "rdp"] }
ferossh-worker = { path = "../crates/worker" }

# Kept out of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "ipc_decode"
path = "fuzz_targets/ipc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "term_feed"
path = "fuzz_targets/term_feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sftp_decode"
path = "fuzz_targets/sftp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forward_parse"
path = "fuzz_targets/forward_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tmux_feed"
path = "fuzz_targets/tmux_feed.rs"
test = false
doc = false
bench = false

[[bin]]
